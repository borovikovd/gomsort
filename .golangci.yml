version: "2"
run:
  modules-download-mode: readonly
  issues-exit-code: 1
  tests: true
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: none
  enable:
    - errcheck
    - goconst
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - prealloc
    - staticcheck
    - unconvert
    - unused
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 15
    gosec:
      excludes:
        - G306
    govet:
      disable:
        - fieldalignment
        - shadow
      enable-all: true
    lll:
      line-length: 120
      tab-width: 4
    misspell:
      locale: US
      ignore-rules:
        - msort
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    wsl:
      strict-append: false
      allow-assign-and-call: true
      allow-multiline-assign: true
      allow-trailing-comment: true
      allow-cuddle-declarations: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - goconst
          - gocyclo
          - gosec
          - lll
          - prealloc
        path: _test\.go
      - linters:
          - deadcode
          - revive
          - staticcheck
          - unused
          - varcheck
        path: testdata/
      - path: main\.go
        text: should not use ALL_CAPS in Go names
      - linters:
          - gocyclo
        path: pkg/analyzer/
        text: cognitive complexity
      - linters:
          - gocritic
        text: use new octal literal style
      - linters:
          - goconst
        path: (.+)_test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: true
  new: false
  fix: false
severity:
  default: error
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/borovikovd/gomsort
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
